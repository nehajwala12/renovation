<style>
:root{--ink:#16211F;--cream:#F4EFE6;--gold:#A98543;--teal:#1C4A45;--neg:#5C2B2E;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;border:1px solid rgba(22,33,31,.14);border-radius:4px;padding:40px 32px;background:#F8F4EC}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.mark span{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px;line-height:1.15;margin:0 0 8px}
p{margin:0 0 24px;font-size:14px;color:rgba(22,33,31,.72);line-height:1.5}
label{display:block;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
input{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1px solid rgba(22,33,31,.30);border-radius:4px;background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,133,67,.18)}
button{margin-top:16px;width:100%;font:inherit;font-weight:700;font-size:14px;letter-spacing:.04em;padding:12px;border:0;border-radius:4px;background:var(--ink);color:var(--cream);cursor:pointer}
button:hover{background:var(--teal)}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:12px;font-size:13px;color:var(--neg)}
.foot{margin-top:24px;font-size:11px;color:rgba(22,33,31,.5)}
</style>
